<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chive PDF coordinate proof</title>
    <link rel="stylesheet" href="/node_modules/pdfjs-dist/web/pdf_viewer.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        color: #172033;
        background: #e8ecf3;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 18px;
      }

      .pdfViewer {
        --scale-factor: 1.35;
      }

      .pdfViewer .page {
        margin: 0;
        border: 1px solid #7e8799;
        box-shadow: 0 10px 28px rgb(23 32 51 / 0.18);
      }

      canvas {
        position: absolute;
        inset: 0;
      }

      .proof-box {
        position: absolute;
        z-index: 4;
        box-sizing: border-box;
        border: 3px solid #d5203e;
        background: rgb(213 32 62 / 0.08);
        pointer-events: none;
      }

      .proof-box[data-label="rotated"] {
        border-color: #0068d9;
        background: rgb(0 104 217 / 0.08);
      }

      .proof-box span {
        position: absolute;
        top: -22px;
        left: -3px;
        padding: 2px 5px;
        color: white;
        background: #d5203e;
        font: 12px/16px ui-monospace, monospace;
      }

      .proof-box[data-label="rotated"] span {
        background: #0068d9;
      }
    </style>
  </head>
  <body>
    <h1 id="title">PDF coordinate proof</h1>
    <div class="pdfViewer">
      <div class="page" id="page">
        <canvas id="canvas"></canvas>
        <div class="textLayer" id="text-layer"></div>
      </div>
    </div>
    <script type="module" src="/scripts/harness.mjs"></script>
  </body>
</html>
